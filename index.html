<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemanth | DevOps Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ambient-light light-blue"></div>
    <div class="ambient-light light-purple"></div>

    <nav class="navbar">
        <div class="logo">Hemanth's Portfolio</div>
        <ul class="nav-links">
            <li><a href="#" class="nav-item active" data-target="home">Home</a></li>
            <li><a href="#" class="nav-item" data-target="experience">Experience</a></li>
            <li><a href="#" class="nav-item" data-target="projects">Projects</a></li>
            <li><a href="HemanthKumarReddy_Devops.pdf" download="Bellam_Hemanth_Kumar_Reddy_Resume.pdf" class="btn-resume"><i class="fas fa-download"></i> Resume</a></li>
        </ul>
    </nav>

    <main class="dashboard">
        
        <div class="left-panel glass-card">
            <div id="dynamic-content" class="fade-in">
                </div>
        </div>

        <div class="right-panel">
            <div class="orbit-wrapper">
                
                <div class="center-profile">
                    <img src="https://via.placeholder.com/300x300/1e293b/ffffff?text=Your+Photo" alt="Hemanth">
                </div>

                <div class="orbit-track">
                    
                    <div class="node node-1">
                        <div class="icon-box aws" data-target="aws">
                            <i class="fab fa-aws"></i>
                        </div>
                    </div>
                    
                    <div class="node node-2">
                        <div class="icon-box docker" data-target="docker">
                            <i class="fab fa-docker"></i>
                        </div>
                    </div>
                    
                    <div class="node node-3">
                        <div class="icon-box python" data-target="python">
                            <i class="fab fa-python"></i>
                        </div>
                    </div>
                    
                    <div class="node node-4">
                        <div class="icon-box linux" data-target="linux">
                            <i class="fab fa-linux"></i>
                        </div>
                    </div>
                    
                    <div class="node node-5">
                        <div class="icon-box k8s" data-target="k8s">
                            <i class="fas fa-dharmachakra"></i>
                        </div>
                    </div>

                </div>
            </div>
            <p class="orbit-hint"><i class="fas fa-mouse-pointer"></i> Hover to pause • Click icons to explore</p>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
