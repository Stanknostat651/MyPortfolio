<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | DevOps Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Version 10.0 forces the browser to load the fixed files -->
    <link rel="stylesheet" href="style.css?v=10.0">
</head>
<body>

    <!-- Ambient Backlight Glows -->
    <div class="ambient-light light-blue"></div>
    <div class="ambient-light light-purple"></div>

    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="logo">DevOps Portfolio</div>
        <ul class="nav-links">
            <li><a href="#" class="nav-item active" data-target="home">Home</a></li>
            <li><a href="#" class="nav-item" data-target="skills">Skills</a></li>
            <li><a href="#" class="nav-item" data-target="experience">Experience</a></li>
            <li><a href="#" class="nav-item" data-target="projects">Projects</a></li>
            <li><a href="HemanthKumarReddy_Devops.pdf" download class="btn-resume"><i class="fas fa-file-pdf"></i> Resume</a></li>
        </ul>
    </nav>

    <!-- Main Dashboard (Strict Single-Screen) -->
    <main class="dashboard">
        
        <!-- LEFT PANEL: Dynamic Screen -->
        <div class="left-panel glass-card">
            <!-- JS injects content here. ID matches script exactly. -->
            <div id="dynamic-content"></div>
        </div>

        <!-- RIGHT PANEL: Orbital Visual System -->
        <div class="right-panel">
            <div class="orbit-wrapper">
                
                <!-- Center Profile -->
                <div class="center-profile">
                    <!-- Replace with your actual photo URL -->
                    <img src="https://via.placeholder.com/300x300/1e293b/ffffff?text=Your+Photo" alt="Profile">
                </div>

                <!-- Rotating Orbit Track -->
                <div class="orbit-track">
                    <!-- Node 1: AWS -->
                    <div class="node node-1">
                        <div class="icon-box aws" data-target="aws"><i class="fab fa-aws"></i></div>
                    </div>
                    <!-- Node 2: Docker -->
                    <div class="node node-2">
                        <div class="icon-box docker" data-target="docker"><i class="fab fa-docker"></i></div>
                    </div>
                    <!-- Node 3: Python -->
                    <div class="node node-3">
                        <div class="icon-box python" data-target="python"><i class="fab fa-python"></i></div>
                    </div>
                    <!-- Node 4: Linux -->
                    <div class="node node-4">
                        <div class="icon-box linux" data-target="linux"><i class="fab fa-linux"></i></div>
                    </div>
                    <!-- Node 5: Kubernetes -->
                    <div class="node node-5">
                        <div class="icon-box k8s" data-target="k8s"><i class="fas fa-dharmachakra"></i></div>
                    </div>
                </div>

            </div>
            <p class="orbit-hint"><i class="fas fa-mouse-pointer"></i> Hover to pause • Click icons to explore</p>
        </div>

    </main>

    <script src="script.js?v=10.0"></script>
</body>
</html>
